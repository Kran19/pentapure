<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pentapure Factory Operations</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Splash Screen -->
  <div id="splash-screen" style="position:fixed; top:0; left:0; right:0; bottom:0; background:var(--dark); z-index:9999; display:flex; justify-content:center; align-items:center; flex-direction:column; transition: opacity 0.5s ease;">
    <img src="https://pentapurefoods.com/wp-content/uploads/2025/11/logo.png" alt="Logo" style="width:180px; margin-bottom:20px; object-fit:contain;">
    <h1 style="color:var(--text-main); font-size:2rem; font-weight:700;">Penta<span style="color:var(--primary-light)">pure</span></h1>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container"></div>

  <!-- Bottom Drawer -->
  <div id="bottom-drawer-overlay" class="bottom-drawer-overlay" onclick="if(event.target.id==='bottom-drawer-overlay') app.closeDrawer()">
    <div class="bottom-drawer" id="bottom-drawer">
      <div class="bottom-drawer-handle"></div>
      <div id="drawer-content"></div>
    </div>
  </div>

  <!-- Global Modal Overlay -->
  <div id="modal-overlay" class="modal-overlay" onclick="if(event.target.id==='modal-overlay') app.closeModal()">
    <div class="modal-content" id="modal-content">
      <!-- Modal dynamically injected here -->
    </div>
  </div>

  <div class="app-container" id="app-root">
    
    <!-- Login Screen -->
    <div id="login-screen">
      <div class="login-card">
        <img src="https://pentapurefoods.com/wp-content/uploads/2025/11/logo.png" alt="Logo" style="width:120px; margin-bottom:1rem; object-fit:contain;">
        <h1 style="margin-bottom: 1rem; color: var(--text-main);"><span style="color: var(--primary-light);">Pentapure</span></h1>
        <p style="color: var(--text-muted); margin-bottom: 2rem;">Select Role to Login</p>
        <div id="users-list" style="display: flex; flex-direction: column; gap: 0.5rem; text-align: left;">
          <!-- Users injected here -->
        </div>
      </div>
    </div>

    <!-- Main App (Hidden initially) -->
    <div id="main-app" class="hidden" style="width: 100%; height: 100%; display: flex; flex-direction: column;">
      
      <!-- Standard Header (Except Admin) -->
      <header id="app-header">
        <div class="user-info">
          <span class="user-name" id="current-user-name">User</span>
          <span class="role-badge" id="current-user-role">ROLE</span>
        </div>
        <div>
          <!-- Notification Bell or Settings icon can go here -->
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--text-muted); cursor:pointer;" onclick="app.navigate('profile')">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
      </header>

      <!-- Admin Layout Container -->
      <div id="admin-panel" class="admin-layout-wrapper">
        <div id="admin-hamburger" class="admin-hamburger hidden" onclick="document.getElementById('admin-sidebar').classList.add('mobile-open')">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </div>

        <div id="admin-mobile-header" class="admin-mobile-header">Pentapure Admin</div>

        <!-- Admin Sidebar -->
        <div id="admin-sidebar" class="admin-sidebar hidden">
          <div style="text-align:center; padding:1rem 1rem 0.5rem;">
            <img src="https://pentapurefoods.com/wp-content/uploads/2025/11/logo.png" alt="Logo" style="width:80px; object-fit:contain; margin-bottom:0.5rem;">
          </div>
          <div style="padding: 0 1rem 1rem; font-size: 1.3rem; font-weight: bold; color: white; border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center;">
            <div>Admin<span style="color:var(--primary-light)">Panel</span></div>
            <svg class="admin-close-btn" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" onclick="document.getElementById('admin-sidebar').classList.remove('mobile-open')">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </div>
          <div class="nav-item active" onclick="app.renderAdminDashboard(this); document.getElementById('admin-sidebar').classList.remove('mobile-open')">Dashboard</div>
          <div class="nav-item" onclick="app.renderAdminUsers(this); document.getElementById('admin-sidebar').classList.remove('mobile-open')">Users & Hierarchy</div>
          <div class="nav-item" onclick="app.renderAdminProducts(this); document.getElementById('admin-sidebar').classList.remove('mobile-open')">Products Master</div>
          <div class="nav-item" onclick="app.renderAdminStock(this); document.getElementById('admin-sidebar').classList.remove('mobile-open')">Live Stock</div>
          <div class="nav-item" onclick="app.renderAdminPurchaseOrders(this); document.getElementById('admin-sidebar').classList.remove('mobile-open')">Purchase Orders</div>
          <div class="nav-item" onclick="app.renderAdminLogs(this); document.getElementById('admin-sidebar').classList.remove('mobile-open')">Activity Logs</div>
          <div class="nav-item" onclick="app.logout()" style="margin-top: auto; border-top: 1px solid var(--glass-border); padding-top: 1rem; color: var(--danger);">Logout</div>
        </div>

        <!-- Shared Content Area -->
        <div class="main-content" id="content-area">
          <!-- Dynamic content injected here -->
        </div>
      </div>

      <!-- Bottom Navigation (Mobile Only) -->
      <div class="bottom-nav" id="bottom-nav">
        <div class="nav-item active" onclick="app.navigate('home')">
          <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          <span>Home</span>
        </div>
        <div class="nav-item" onclick="app.navigate('add')">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
          <span>Action</span>
        </div>
        <div class="nav-item" onclick="app.navigate('history')">
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
          <span>History</span>
        </div>
        <div class="nav-item" onclick="app.navigate('profile')">
          <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          <span>Profile</span>
        </div>
      </div>
      
    </div>
  </div>

  <script src="js/mockData.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
